{% extends "layout.html" %}

{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Books Catalog</h1>
        <button onclick="showModal('addBookModal')" class="btn">Add Book</button>
    </div>

    <input type="text" id="searchInput" placeholder="Search by title, author, or category..." onkeyup="searchBooks()">

    <table id="booksTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Populated by JS -->
        </tbody>
    </table>
</div>

<!-- Add Book Modal -->
<div id="addBookModal" class="modal">
    <div class="modal-content">
        <h2>Add New Book</h2>
        <form id="addBookForm">
            <label>Title</label>
            <input type="text" name="title" required>

            <label>Author</label>
            <input type="text" name="author" required>

            <label>Category</label>
            <input type="text" name="category">

            <div class="actions" style="margin-top: 1rem;">
                <button type="submit" class="btn">Save</button>
                <button type="button" onclick="closeModal('addBookModal')" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Borrow Book Modal -->
<div id="borrowBookModal" class="modal">
    <div class="modal-content">
        <h2>Borrow Book</h2>
        <input type="hidden" id="borrowBookId">
        <p id="borrowBookTitle"></p>

        <label>Select Borrower</label>
        <select id="borrowerSelect" required>
            <!-- Populated by JS -->
        </select>

        <div class="actions" style="margin-top: 1rem;">
            <button onclick="confirmBorrow()" class="btn">Confirm Borrow</button>
            <button type="button" onclick="closeModal('borrowBookModal')" class="btn btn-secondary">Cancel</button>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadBooks();
        loadBorrowersForSelect(); // Pre-load for modal
    });

    async function loadBooks(query = '') {
        const url = query ? `/api/books?q=${encodeURIComponent(query)}` : '/api/books';
        const books = await fetchData(url);
        const tbody = document.querySelector('#booksTable tbody');
        tbody.innerHTML = '';

        books.forEach(book => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${book.book_id}</td>
                <td>${book.title}</td>
                <td>${book.author}</td>
                <td>${book.category || '-'}</td>
                <td>
                    <span class="badge ${book.availability ? 'badge-success' : 'badge-danger'}">
                        ${book.availability ? 'Available' : 'Borrowed'}
                    </span>
                </td>
                <td>
                    ${book.availability
                    ? `<button onclick="openBorrowModal(${book.book_id}, '${book.title}')" class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">Borrow</button>`
                    : '<span style="color: grey;">Unavailable</span>'}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function loadBorrowersForSelect() {
        const borrowers = await fetchData('/api/borrowers');
        const select = document.getElementById('borrowerSelect');
        select.innerHTML = borrowers.map(b => `<option value="${b.borrower_id}">${b.name} (${b.email})</option>`).join('');
    }

    async function searchBooks() {
        const query = document.getElementById('searchInput').value;
        loadBooks(query);
    }

    document.getElementById('addBookForm').onsubmit = async (e) => {
        e.preventDefault();
        const storedData = new FormData(e.target);
        const data = Object.fromEntries(storedData.entries());

        try {
            await postData('/api/books', data);
            closeModal('addBookModal');
            e.target.reset();
            loadBooks(); // Refresh list
        } catch (err) {
            alert(err.message);
        }
    };

    function openBorrowModal(id, title) {
        document.getElementById('borrowBookId').value = id;
        document.getElementById('borrowBookTitle').textContent = `Borrowing: ${title}`;
        showModal('borrowBookModal');
    }

    async function confirmBorrow() {
        const bookId = document.getElementById('borrowBookId').value;
        const borrowerId = document.getElementById('borrowerSelect').value;

        try {
            await postData('/api/borrow', { book_id: bookId, borrower_id: borrowerId });
            closeModal('borrowBookModal');
            loadBooks(); // Refresh list
        } catch (err) {
            alert(err.message);
        }
    }
</script>
{% endblock %}
